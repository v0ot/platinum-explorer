<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>File Explorer (Platinum)</title>
  <defs>
    <!-- back panel + tab: satin graphite-silver -->
    <linearGradient id="back" x1="0" y1="20" x2="256" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8ADB3"/>
      <stop offset="1" stop-color="#8A8F95"/>
    </linearGradient>
    <!-- front face: platinum, bright top-left falling to deeper silver bottom-right -->
    <linearGradient id="front" x1="0" y1="48" x2="230" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDE0E3"/>
      <stop offset="0.45" stop-color="#C5C8CC"/>
      <stop offset="1" stop-color="#A5A9AE"/>
    </linearGradient>
    <!-- metallic sheen: soft polished bands -->
    <linearGradient id="sheen" x1="0" y1="48" x2="256" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.26" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.50" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.68" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#2E333A" stop-opacity="0.12"/>
    </linearGradient>
    <!-- top lip highlight -->
    <linearGradient id="lip" x1="0" y1="0" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F9FA"/>
      <stop offset="1" stop-color="#E3E6E9"/>
    </linearGradient>
    <!-- pocket: white, faint cool falloff toward the bottom edge -->
    <linearGradient id="pocket" x1="60" y1="172" x2="150" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F6F7F8"/>
      <stop offset="1" stop-color="#E1E4E8"/>
    </linearGradient>
    <linearGradient id="slot" x1="76" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#868B92"/>
      <stop offset="1" stop-color="#6C7178"/>
    </linearGradient>
    <clipPath id="clipBack"><path d="M10 244A10 10 0 0 1 0 234L0 30A10 10 0 0 1 10 20L76.008 20A18.5 18.5 0 0 1 90.455 26.943L102.899 42.499A4 4 0 0 0 106.022 44L244 44A12 12 0 0 1 256 56L256 234A10 10 0 0 1 246 244Z"/></clipPath>
    <clipPath id="clipFront"><path d="M10 244A10 10 0 0 1 0 234L0 70A10 10 0 0 1 10 60L80.167 60A25 25 0 0 0 95.167 55L102.9 49.2A6 6 0 0 1 106.5 48L244 48A12 12 0 0 1 256 60L256 234A10 10 0 0 1 246 244Z"/></clipPath>
    <filter id="blurA" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="blurB" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- back panel / tab -->
  <path d="M10 244A10 10 0 0 1 0 234L0 30A10 10 0 0 1 10 20L76.008 20A18.5 18.5 0 0 1 90.455 26.943L102.899 42.499A4 4 0 0 0 106.022 44L244 44A12 12 0 0 1 256 56L256 234A10 10 0 0 1 246 244Z" fill="url(#back)"/>
  <g clip-path="url(#clipBack)">
    <path d="M10 244A10 10 0 0 1 0 234L0 70A10 10 0 0 1 10 60L80.167 60A25 25 0 0 0 95.167 55L102.9 49.2A6 6 0 0 1 106.5 48L244 48A12 12 0 0 1 256 60L256 234A10 10 0 0 1 246 244Z" transform="translate(0 -1.5)" fill="#22272E" fill-opacity="0.38" filter="url(#blurA)"/>
  </g>
  <!-- front face: lip, then body shifted down beneath it -->
  <path d="M10 244A10 10 0 0 1 0 234L0 70A10 10 0 0 1 10 60L80.167 60A25 25 0 0 0 95.167 55L102.9 49.2A6 6 0 0 1 106.5 48L244 48A12 12 0 0 1 256 60L256 234A10 10 0 0 1 246 244Z" fill="url(#lip)"/>
  <g clip-path="url(#clipFront)">
    <path d="M10 244A10 10 0 0 1 0 234L0 70A10 10 0 0 1 10 60L80.167 60A25 25 0 0 0 95.167 55L102.9 49.2A6 6 0 0 1 106.5 48L244 48A12 12 0 0 1 256 60L256 234A10 10 0 0 1 246 244Z" transform="translate(0 4)" fill="url(#front)"/>
    <path d="M10 244A10 10 0 0 1 0 234L0 70A10 10 0 0 1 10 60L80.167 60A25 25 0 0 0 95.167 55L102.9 49.2A6 6 0 0 1 106.5 48L244 48A12 12 0 0 1 256 60L256 234A10 10 0 0 1 246 244Z" transform="translate(0 4)" fill="url(#sheen)"/>
    <path d="M44 244L44 204A32 32 0 0 1 76 172L180 172A32 32 0 0 1 212 204L212 244Z" transform="translate(1 0.5)" fill="#1C2026" fill-opacity="0.34" filter="url(#blurB)"/>
    <path d="M44 244L44 204A32 32 0 0 1 76 172L180 172A32 32 0 0 1 212 204L212 244Z" fill="url(#pocket)"/>
  </g>
  <!-- slot -->
  <rect x="76" y="204" width="104" height="8" rx="4" fill="url(#slot)"/>
</svg>
